# Supabase CLI configuration (local development and `supabase db push`).
project_id = "ipl-grievance"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = []
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
minimum_password_length = 6     # members use a 6-digit PIN; staff passwords are checked (>=10) when created

[auth.email]
enable_signup = true
double_confirm_changes = true
# Member accounts use a login-only address derived from the phone number and
# can never receive mail, so email confirmation must be off.
enable_confirmations = false

[auth.sms]
enable_signup = false

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[functions.whatsapp-webhook]
verify_jwt = false               # Meta can't send a Supabase JWT; the HMAC signature is verified instead

[functions.notify-dispatch]
verify_jwt = false               # called by the scheduler with x-dispatch-secret
