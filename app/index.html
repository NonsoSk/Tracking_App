<title>Fintech ML Ledger</title>
<meta name="description" content="A 52-week Python & machine learning plan for fintech, with a mentor CRM, studies planner and reminders.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap">
<style>
  :root {
    --ground: #f2f4f0;
    --surface: #fbfcfa;
    --sunk: #e8ece7;
    --ink: #17211d;
    --muted: #5b6862;
    --rule: #d6ddd8;
    --accent: #1e5b47;
    --accent-ink: #ffffff;
    --accent-soft: #dcebe3;
    --gold: #9a700f;
    --gold-soft: #f1e6c8;
    --warn: #9c5c0c;
    --warn-soft: #f6e5cc;
    --bad: #a63a2b;
    --bad-soft: #f6dcd6;
    --good: #2e7a4e;
    --focus: #2f7fd6;
    --radius: 10px;
    --sans: "Schibsted Grotesk", "Segoe UI", system-ui, -apple-system, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --ground: #0e1412; --surface: #151d1a; --sunk: #1c2622; --ink: #e3eae6; --muted: #93a29b; --rule: #293430;
      --accent: #6cc4a0; --accent-ink: #0b1a14; --accent-soft: #1b3a2e; --gold: #d8ac45; --gold-soft: #3a3018;
      --warn: #e0a04a; --warn-soft: #3b2c16; --bad: #e57f6c; --bad-soft: #3d201b; --good: #6cc48a; --focus: #7db6ff;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --ground: #0e1412; --surface: #151d1a; --sunk: #1c2622; --ink: #e3eae6; --muted: #93a29b; --rule: #293430;
    --accent: #6cc4a0; --accent-ink: #0b1a14; --accent-soft: #1b3a2e; --gold: #d8ac45; --gold-soft: #3a3018;
    --warn: #e0a04a; --warn-soft: #3b2c16; --bad: #e57f6c; --bad-soft: #3d201b; --good: #6cc48a; --focus: #7db6ff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--ground); color: var(--ink); font: 15px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
  a { color: var(--accent); text-underline-offset: 2px; }
  a:hover { text-decoration-thickness: 2px; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
  h1, h2, h3, h4 { margin: 0; line-height: 1.15; text-wrap: balance; }
  h1 { font-size: clamp(1.7rem, 4.5vw, 2.5rem); font-weight: 800; letter-spacing: -0.025em; }
  h2 { font-size: 1.35rem; font-weight: 750; letter-spacing: -0.015em; }
  h3 { font-size: 1.05rem; font-weight: 700; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  h4 { font-size: 0.98rem; font-weight: 700; }
  p { margin: 0; }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); font-weight: 400; }
  .small { font-size: 0.84rem; }
  .eyebrow { font: 500 0.72rem/1.3 var(--mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }

  /* shell */
  .top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--ground); border-bottom: 1px solid var(--rule); }
  .top-in { max-width: 1100px; margin: 0 auto; padding: 10px 16px 0; }
  .brand { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .brand b { font-weight: 800; letter-spacing: -0.02em; font-size: 1.05rem; display: flex; align-items: center; gap: 8px; }
  .mark { width: 22px; height: 22px; border-radius: 5px; background: var(--accent); display: grid; place-items: center; color: var(--accent-ink); font: 600 11px/1 var(--mono); }
  .tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; margin-top: 8px; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { appearance: none; border: 0; background: none; color: var(--muted); font: 600 0.9rem var(--sans); padding: 8px 12px 10px; cursor: pointer; white-space: nowrap; border-bottom: 2px solid transparent; }
  .tab:hover { color: var(--ink); }
  .tab.on { color: var(--ink); border-bottom-color: var(--accent); }
  main { max-width: 1100px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 64px; display: flex; flex-direction: column; gap: 16px; }
  .hero { display: flex; flex-direction: column; gap: 6px; padding-block: 8px 4px; }
  .lede { max-width: 68ch; color: var(--muted); font-size: 1rem; }

  /* panels & grids */
  .panel { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 16px; align-items: start; }
  .week-body .grid2 > div { display: flex; flex-direction: column; gap: 10px; min-width: 0; }

  /* KPIs */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; background: var(--rule); border: 1px solid var(--rule); border-radius: var(--radius); overflow: hidden; }
  .kpi { background: var(--surface); padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
  .kpi-k { font: 500 0.7rem var(--mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
  .kpi-v { font: 600 1.6rem/1 var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  .kpi-v small { font-size: 0.8rem; color: var(--muted); font-weight: 400; }
  .kpi-note { font-size: 0.75rem; color: var(--muted); }
  .bar { display: block; height: 6px; background: var(--sunk); border-radius: 3px; overflow: hidden; flex: 1; min-width: 60px; }
  .bar > span { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
  .bar.gold > span { background: var(--gold); }

  /* checkboxes */
  .checks { display: flex; flex-direction: column; gap: 2px; }
  .checks.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 2px 16px; }
  .checks.tight { border-top: 1px dashed var(--rule); padding-top: 8px; }
  .chk { display: flex; gap: 10px; align-items: flex-start; padding: 6px 6px; border-radius: 6px; cursor: pointer; }
  .chk:hover { background: var(--sunk); }
  .chk input { width: 18px; height: 18px; margin: 1px 0 0; accent-color: var(--accent); flex: none; cursor: pointer; }
  .chk.is-done > span { color: var(--muted); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--muted) 60%, transparent); }
  .chk.inline { display: inline-flex; padding: 4px 6px; align-items: center; }
  .chk.inline input { margin: 0; }

  /* buttons & pills */
  .btn { appearance: none; border: 1px solid var(--rule); background: var(--surface); color: var(--ink); font: 600 0.88rem var(--sans); padding: 8px 14px; border-radius: 8px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
  .btn:hover { border-color: var(--muted); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.danger { background: var(--bad); color: #fff; border-color: var(--bad); }
  .btn.ghost { background: none; border-color: transparent; color: var(--muted); }
  .btn.ghost:hover { color: var(--ink); border-color: var(--rule); }
  .btn.sm { padding: 5px 10px; font-size: 0.82rem; }
  .btn[disabled] { opacity: 0.5; cursor: not-allowed; }
  .linkish { appearance: none; background: none; border: 0; padding: 0; font: inherit; color: var(--accent); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .actions > a { font-size: 0.85rem; font-weight: 600; }
  .pill { display: inline-flex; align-items: center; gap: 4px; font: 500 0.74rem/1 var(--mono); padding: 4px 8px; border-radius: 999px; background: var(--sunk); color: var(--muted); white-space: nowrap; width: fit-content; }
  .pill.accent { background: var(--accent-soft); color: var(--accent); }
  .pill.warn { background: var(--warn-soft); color: var(--warn); }
  .pill.bad { background: var(--bad-soft); color: var(--bad); }
  .chip { appearance: none; border: 1px solid var(--rule); background: var(--surface); color: var(--ink); font: 500 0.8rem var(--sans); padding: 4px 10px; border-radius: 999px; cursor: pointer; text-decoration: none; display: inline-block; }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  .x { appearance: none; border: 0; background: none; color: var(--muted); font-size: 1.1rem; line-height: 1; cursor: pointer; padding: 2px 6px; border-radius: 4px; }
  .x:hover { color: var(--bad); background: var(--bad-soft); }
  .confirm { display: inline-flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 0.85rem; font-weight: 600; }
  .note { background: var(--sunk); border-radius: 8px; padding: 10px 12px; font-size: 0.86rem; }
  .bad-text { color: var(--bad); }

  /* forms */
  .fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 10px 14px; align-items: end; }
  .field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .field.wide { grid-column: 1 / -1; }
  .field > span { font: 500 0.72rem var(--mono); text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
  input:not([type="checkbox"]):not([type="file"]), select, textarea { font: 400 0.92rem var(--sans); color: var(--ink); background: var(--ground); border: 1px solid var(--rule); border-radius: 7px; padding: 8px 10px; width: 100%; min-width: 0; }
  textarea { resize: vertical; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--focus); outline-offset: 0; border-color: transparent; }
  .field.sm { max-width: 150px; }
  .field.grow { flex: 1 1 260px; }
  .inline-form { display: flex; gap: 8px; }
  .file-btn { position: relative; overflow: hidden; }
  .file-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .form { border-color: var(--accent); }

  /* today */
  .plan, .plist, .res, .places, .steps, .quotes { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; }
  .plan li { display: grid; grid-template-columns: 58px 1fr; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--rule); }
  .plan li:last-child { border-bottom: 0; }
  .plan li.school span:last-child { color: var(--gold); font-weight: 600; }
  .plan em { color: var(--muted); font-style: normal; font-size: 0.85rem; }
  .plist li { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--rule); flex-wrap: wrap; }
  .plist li:last-child { border-bottom: 0; }
  .plist li.is-done { opacity: 0.6; }
  .row-actions { display: inline-flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 0.85rem; }
  .panel h4 { margin-top: 4px; }
  .res li { padding: 3px 0; font-size: 0.9rem; }
  .res li::before { content: "→ "; color: var(--muted); }

  /* problem */
  .problem { background: var(--accent-soft); border-radius: var(--radius); padding: 14px; display: flex; flex-direction: column; gap: 8px; }
  .problem h4 { font-size: 1.08rem; }
  .problem .chk:hover { background: color-mix(in srgb, var(--surface) 55%, transparent); }
  .builds { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 0.82rem; color: var(--muted); }
  .practice { border-top: 1px solid var(--rule); padding-top: 14px; }
  .drills, .assess { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .dn { display: inline-block; min-width: 1.4em; color: var(--muted); }
  .quiz { display: flex; flex-direction: column; gap: 6px; }
  .quiz-item { border: 1px solid var(--rule); border-radius: 8px; padding: 4px 8px 6px; display: flex; flex-direction: column; gap: 2px; }
  .quiz-item > p { padding: 4px 0; }
  .answer summary { cursor: pointer; font-size: 0.8rem; font-weight: 600; color: var(--accent); padding: 2px 6px; width: fit-content; }
  .answer p { font-size: 0.88rem; background: var(--sunk); border-radius: 6px; padding: 8px 10px; margin: 4px 0 2px; }
  .carry { background: var(--gold-soft); border-radius: var(--radius); padding: 12px; display: flex; flex-direction: column; gap: 6px; }
  .carry .chk:hover { background: color-mix(in srgb, var(--surface) 55%, transparent); }
  .week-foot { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; border-top: 1px solid var(--rule); padding-top: 12px; }

  /* roadmap */
  .phase { display: flex; flex-direction: column; gap: 6px; }
  .phase-head { display: flex; justify-content: space-between; gap: 16px; align-items: flex-end; flex-wrap: wrap; padding: 18px 0 8px; border-bottom: 2px solid var(--ink); margin-bottom: 4px; }
  .phase-head > div:first-child { display: flex; flex-direction: column; gap: 4px; max-width: 70ch; }
  .phase-pct { display: flex; align-items: center; gap: 8px; min-width: 180px; }
  .week { background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; }
  .week > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 44px 1fr auto 140px; gap: 12px; align-items: center; padding: 10px 14px; }
  .week > summary::-webkit-details-marker { display: none; }
  .week > summary:hover { background: var(--sunk); border-radius: 8px; }
  .week[open] > summary { border-bottom: 1px solid var(--rule); border-radius: 8px 8px 0 0; }
  .week .wn { color: var(--muted); font-size: 0.85rem; }
  .week .wt { font-weight: 600; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .week .wd { font-size: 0.82rem; white-space: nowrap; }
  .week .wp { display: flex; gap: 8px; align-items: center; }
  .week.current { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
  .week.done .wn { color: var(--good); }
  .week.behind .wn { color: var(--warn); }
  .week .week-body { border: 0; border-radius: 0 0 8px 8px; }

  /* mentors */
  .funnel { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 6px; }
  .fstage { appearance: none; border: 1px solid var(--rule); background: var(--surface); border-radius: 8px; padding: 8px 10px; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 2px; color: var(--ink); font: 500 0.78rem var(--sans); }
  .fstage .mono { font-size: 1.25rem; font-weight: 600; }
  .fstage.on { border-color: var(--accent); background: var(--accent-soft); }
  .fstage:nth-child(8) .mono { color: var(--gold); }
  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
  .seg button { appearance: none; border: 0; background: var(--surface); padding: 7px 12px; font: 600 0.84rem var(--sans); color: var(--muted); cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--rule); }
  .seg button.on { background: var(--ink); color: var(--ground); }
  .search { max-width: 280px; }
  .pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 12px; align-items: start; }
  .pgrid.wide { grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); }
  .pcard { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .pcard header { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
  .pcard header > div { min-width: 0; }
  .pcard h4 a { color: var(--ink); }
  .stage-select { width: auto !important; flex: none; font-size: 0.82rem !important; padding: 5px 8px !important; }
  .pcard.stage-mentor { border-color: var(--gold); box-shadow: inset 0 3px 0 var(--gold); }
  .pcard.stage-parked { opacity: 0.65; }
  .pmeta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .next { font-size: 0.88rem; padding: 8px 10px; border-radius: 7px; background: var(--sunk); }
  .next.accent { background: var(--accent-soft); }
  .next.warn { background: var(--warn-soft); }
  .good-time { color: var(--good); font-weight: 600; }
  .empty { padding: 20px 0; }
  .email-helper { display: flex; flex-direction: column; gap: 8px; border-top: 1px dashed var(--rule); padding-top: 12px; }
  .linkrow, .patterns { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 0.86rem; }
  .patterns { gap: 6px; }

  /* finder */
  .search-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 12px; }
  .scard { border: 1px solid var(--rule); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  code.q { font: 0.78rem/1.45 var(--mono); background: var(--sunk); padding: 8px; border-radius: 6px; overflow-wrap: anywhere; }
  .steps { list-style: decimal; padding-left: 20px; gap: 6px; }
  .places { gap: 10px; }
  .places li { display: flex; flex-direction: column; gap: 2px; }
  .places a { font-weight: 600; }

  /* messages */
  .tgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr)); gap: 12px; align-items: start; }
  .tmpl header { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
  pre.msg { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font: 0.9rem/1.55 var(--sans); background: var(--ground); border: 1px solid var(--rule); border-radius: 8px; padding: 12px; max-height: 360px; overflow: auto; }
  .formula { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; margin: 0; }
  .formula dt { font: 600 0.8rem var(--mono); text-transform: uppercase; letter-spacing: 0.06em; color: var(--accent); padding-top: 2px; }
  .formula dd { margin: 0; }
  .quotes { gap: 8px; }
  .quotes li { font-size: 0.88rem; padding-left: 12px; border-left: 2px solid var(--rule); color: var(--muted); }

  /* studies */
  .timetable { display: grid; grid-template-columns: repeat(7, minmax(120px, 1fr)); gap: 8px; overflow-x: auto; padding-bottom: 4px; }
  .tday { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .tclass { position: relative; background: var(--gold-soft); border-radius: 7px; padding: 8px 26px 8px 10px; display: flex; flex-direction: column; gap: 2px; font-size: 0.85rem; }
  .tclass .x { position: absolute; top: 4px; right: 2px; }

  /* projects */
  .project.shipped { border-color: var(--gold); box-shadow: inset 0 3px 0 var(--gold); }
  .prow { display: flex; align-items: center; gap: 10px; }
  .plabel { flex: 0 0 min(46%, 210px); font-size: 0.88rem; }

  /* progress */
  .weekgrid { display: grid; grid-template-columns: repeat(13, 1fr); gap: 4px; }
  .wcell { appearance: none; aspect-ratio: 1; max-width: 100%; border: 1px solid var(--rule); border-radius: 5px; cursor: pointer; padding: 0; background: color-mix(in srgb, var(--accent) calc(var(--p) * 100%), var(--sunk)); color: var(--ink); font: 500 0.66rem var(--mono); display: grid; place-items: center; }
  .wcell span { mix-blend-mode: normal; }
  .wcell[style*="--p:1.00"], .wcell[style*="--p:0.9"], .wcell[style*="--p:0.8"], .wcell[style*="--p:0.7"], .wcell[style*="--p:0.6"] { color: var(--accent-ink); }
  .wcell.now { outline: 2px solid var(--gold); outline-offset: 1px; }
  .chart-wrap { overflow-x: auto; }
  .chart { width: 100%; min-width: 560px; height: auto; display: block; }
  .chart .grid { stroke: var(--rule); stroke-width: 1; }
  .chart .goal { stroke: var(--gold); stroke-dasharray: 4 4; stroke-width: 1.5; }
  .chart .tick { fill: var(--muted); font: 10px var(--mono); }
  .chart .hb { fill: var(--accent); }
  .chart .cur { fill: var(--gold); }

  /* settings */
  .routine { display: flex; flex-direction: column; gap: 6px; }
  .rrow { display: grid; grid-template-columns: 130px 110px 80px 1fr auto; gap: 6px; align-items: center; }
  .linkcol { display: flex; flex-direction: column; gap: 6px; font-weight: 600; font-size: 0.9rem; }
  .sync { font: 500 0.8rem var(--mono); padding: 4px 8px; border-radius: 6px; background: var(--sunk); color: var(--muted); }
  .sync.ok { background: var(--accent-soft); color: var(--accent); }
  .sync.warn { background: var(--warn-soft); color: var(--warn); }
  .sync.bad { background: var(--bad-soft); color: var(--bad); }

  .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--ground); padding: 10px 16px; border-radius: 8px; font-weight: 600; font-size: 0.9rem; z-index: 20; max-width: calc(100% - 32px); }

  @media (max-width: 640px) {
    .week > summary { grid-template-columns: 38px 1fr; gap: 4px 10px; }
    .week .wd { grid-column: 2; }
    .week .wp { grid-column: 2; }
    .rrow { grid-template-columns: 1fr 1fr 70px auto; }
    .rrow input[data-field="label"] { grid-column: 1 / -1; grid-row: 2; }
    .pcard header { flex-direction: column; }
    .search { max-width: none; flex: 1 1 100%; }
    .weekgrid { gap: 3px; }
    .wcell { font-size: 0.58rem; border-radius: 3px; }
    .timetable { grid-template-columns: repeat(7, 140px); }
  }
  @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; } }
</style>
