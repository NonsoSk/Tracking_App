<title>Fintech ML Ledger</title>
<meta name="description" content="A 52-week Python & machine learning plan for fintech, with a mentor CRM, studies planner and reminders.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800;6..12,900&display=swap">
<style>
  /* ---------- tokens ---------- */
  :root {
    --ground: #f2f4f8;
    --surface: #ffffff;
    --sunk: #eef1f7;
    --hover: #e8edf6;
    --ink: #1a1f36;
    --ink-2: #3c4462;
    --muted: #6b7390;
    --rule: #e3e7f0;
    --rule-strong: #c9d0de;
    --accent: #0033a1;
    --accent-2: #00257a;
    --accent-ink: #ffffff;
    --accent-soft: #e6ecf8;
    --accent-line: #b8c7ea;
    --sky: #1e9be9;
    --banner: #0033a1;
    --banner-2: #0a4fd1;
    --banner-ink: #ffffff;
    --banner-muted: #c3d3f5;
    --gold: #b0700e;
    --gold-soft: #fdf3df;
    --gold-line: #efd4a0;
    --good: #0f8a4a;
    --warn: #b25c07;
    --warn-soft: #fff1de;
    --bad: #c8312b;
    --bad-soft: #fdeceb;
    --focus: #1e9be9;
    --shadow-sm: 0 1px 3px rgba(26, 31, 54, 0.06);
    --shadow: 0 2px 6px rgba(26, 31, 54, 0.05), 0 8px 24px rgba(26, 31, 54, 0.07);
    --radius: 16px;
    --radius-sm: 10px;
    --sans: "Nunito Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
    --mono: "Nunito Sans", "Segoe UI", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --ground: #0b1224; --surface: #121b33; --sunk: #17223f; --hover: #1d2a4c; --ink: #eef2fb; --ink-2: #c7d0e6; --muted: #8e99b8;
      --rule: #22304f; --rule-strong: #33456d; --accent: #5b8cff; --accent-2: #86aaff; --accent-ink: #061233; --accent-soft: #172a57; --accent-line: #2d4a8f; --sky: #4fb6f5;
      --banner: #0a2a82; --banner-2: #1149c4; --banner-ink: #ffffff; --banner-muted: #b8c9f2;
      --gold: #e9b65c; --gold-soft: #2c2415; --gold-line: #5c4722; --good: #45d38a; --warn: #f2a64d; --warn-soft: #2f2314; --bad: #f58a80; --bad-soft: #341c1c; --focus: #4fb6f5;
      --shadow-sm: none; --shadow: 0 0 0 1px rgba(255, 255, 255, 0.03), 0 10px 28px rgba(0, 0, 0, 0.4);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --ground: #0b1224; --surface: #121b33; --sunk: #17223f; --hover: #1d2a4c; --ink: #eef2fb; --ink-2: #c7d0e6; --muted: #8e99b8;
    --rule: #22304f; --rule-strong: #33456d; --accent: #5b8cff; --accent-2: #86aaff; --accent-ink: #061233; --accent-soft: #172a57; --accent-line: #2d4a8f; --sky: #4fb6f5;
    --banner: #0a2a82; --banner-2: #1149c4; --banner-ink: #ffffff; --banner-muted: #b8c9f2;
    --gold: #e9b65c; --gold-soft: #2c2415; --gold-line: #5c4722; --good: #45d38a; --warn: #f2a64d; --warn-soft: #2f2314; --bad: #f58a80; --bad-soft: #341c1c; --focus: #4fb6f5;
    --shadow-sm: none; --shadow: 0 0 0 1px rgba(255, 255, 255, 0.03), 0 10px 28px rgba(0, 0, 0, 0.4);
  }

  /* ---------- base ---------- */
  * { box-sizing: border-box; }
  html, body { background: var(--ground); }
  body { margin: 0; color: var(--ink); font: 15px/1.55 var(--sans); -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
  a { color: var(--accent); text-decoration: none; font-weight: 500; }
  a:hover { text-decoration: underline; text-underline-offset: 3px; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
  h1, h2, h3, h4 { margin: 0; line-height: 1.15; text-wrap: balance; color: var(--ink); }
  h1 { font-size: clamp(1.6rem, 3.6vw, 2.3rem); font-weight: 800; letter-spacing: -0.02em; }
  h2 { font-size: 1.3rem; font-weight: 700; letter-spacing: -0.02em; }
  h3 { font-size: 1.02rem; font-weight: 650; letter-spacing: -0.01em; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  h4 { font-size: 0.97rem; font-weight: 650; letter-spacing: -0.005em; }
  p { margin: 0; }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); font-weight: 400; }
  .small { font-size: 0.84rem; }
  .eyebrow { font: 800 0.72rem/1.3 var(--sans); text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); }

  /* ---------- shell: blue sidebar on desktop; blue app bar + bottom tabs on phones ---------- */
  .shell { display: grid; grid-template-columns: minmax(0, 1fr); min-height: 100%; }
  .side { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--banner); color: #fff; padding: 12px 16px; min-width: 0; display: flex; align-items: center; justify-content: space-between; gap: 12px; box-shadow: 0 2px 12px rgba(0, 20, 80, 0.18); }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: -0.01em; font-size: 1rem; white-space: nowrap; color: #fff; }
  .brand small { display: block; font: 600 0.72rem var(--sans); color: var(--banner-muted); letter-spacing: 0; }
  .mark { width: 34px; height: 34px; border-radius: 50%; background: #fff; color: var(--banner); display: grid; place-items: center; font: 900 12px/1 var(--sans); flex: none; }
  .toptitle { font-weight: 700; font-size: 0.9rem; color: var(--banner-muted); }
  .tabs { display: none; }
  .tab { appearance: none; border: 0; background: none; color: rgba(255, 255, 255, 0.78); font: 700 0.92rem var(--sans); padding: 11px 14px; border-radius: 12px; cursor: pointer; white-space: nowrap; display: flex; align-items: center; gap: 12px; transition: background 0.15s, color 0.15s; width: 100%; text-align: left; }
  .tab:hover { color: #fff; background: rgba(255, 255, 255, 0.1); }
  .tab.on { background: #fff; color: var(--banner); }
  .ico { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .sidefoot { display: none; }
  main { width: 100%; max-width: 1120px; margin: 0 auto; padding-inline: 16px; padding-block: 18px calc(96px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 18px; min-width: 0; }

  /* bottom tab bar (phones) */
  .bottomnav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--rule); box-shadow: 0 -4px 20px rgba(26, 31, 54, 0.08); display: grid; grid-template-columns: repeat(5, 1fr); padding: 6px 6px calc(6px + env(safe-area-inset-bottom, 0px)); }
  .bn { appearance: none; border: 0; background: none; color: var(--muted); font: 700 0.68rem var(--sans); display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; cursor: pointer; border-radius: 12px; }
  .bn .ico { width: 22px; height: 22px; }
  .bn.on { color: var(--accent); }
  .bn.on .ico { stroke-width: 2.2; }
  .more-wrap[hidden] { display: none !important; }
  .sheet-scrim { position: fixed; inset: 0; z-index: 25; background: rgba(10, 20, 50, 0.4); }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 26; background: var(--surface); border-radius: 22px 22px 0 0; padding: 10px 16px calc(84px + env(safe-area-inset-bottom, 0px)); box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.2); animation: sheet-up 0.22s ease; }
  .grab { display: block; width: 40px; height: 4px; border-radius: 4px; background: var(--rule-strong); margin: 0 auto 14px; }
  .sheet-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; }
  @keyframes sheet-up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }

  @media (min-width: 980px) {
    .shell { grid-template-columns: 264px minmax(0, 1fr); }
    .side { height: 100vh; height: 100dvh; margin-top: 0; flex-direction: column; align-items: stretch; justify-content: flex-start; padding: 26px 16px 18px; gap: 26px; box-shadow: none;
      background: radial-gradient(140% 60% at 0% 0%, var(--banner-2) 0%, transparent 60%), var(--banner); }
    .toptitle, .bottomnav, #moresheet { display: none !important; }
    .brand { padding-inline: 6px; }
    .tabs { display: flex; flex-direction: column; gap: 3px; }
    .sidefoot { display: flex; margin-top: auto; align-items: center; gap: 12px; padding: 14px 12px; border-radius: 14px; background: rgba(255, 255, 255, 0.1); color: #fff; }
    .sidefoot .ring-bg { stroke: rgba(255, 255, 255, 0.2); }
    .sidefoot .ring-fg { stroke: #fff; }
    .sf-ring { position: relative; width: 52px; height: 52px; flex: none; }
    .sf-ring .mono { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 800; font-size: 1rem; }
    .sf-k { font-weight: 800; font-size: 0.9rem; }
    .sf-v { font-size: 0.78rem; color: var(--banner-muted); }
    main { padding-inline: 36px; padding-block: 30px 80px; }
  }

  /* ---------- rings ---------- */
  .ring { display: block; }
  .ring circle { fill: none; }
  .ring-bg { stroke: var(--rule); }
  .ring-fg { stroke: var(--accent); stroke-linecap: round; transition: stroke-dasharray 0.4s ease; }
  .ring.on-dark .ring-bg { stroke: rgba(255, 255, 255, 0.18); }
  .ring.on-dark .ring-fg { stroke: #ffffff; }
  .ring-fg { stroke-linecap: round; }

  /* ---------- page headers ---------- */
  .hero { display: flex; flex-direction: column; gap: 6px; padding-block: 4px 2px; }
  .hero .eyebrow { color: var(--accent); }
  .lede { max-width: 70ch; color: var(--muted); font-size: 1rem; }

  /* Today banner: the one bold moment, a blue ledger sheet */
  .banner { position: relative; overflow: hidden; border-radius: 22px; color: var(--banner-ink); padding: 26px; display: flex; gap: 24px; align-items: center; justify-content: space-between; flex-wrap: wrap;
    background:
      radial-gradient(circle at 105% -10%, rgba(255,255,255,0.16) 0 22%, transparent 22.3%),
      radial-gradient(circle at 105% -10%, rgba(255,255,255,0.08) 0 36%, transparent 36.3%),
      radial-gradient(circle at -5% 120%, rgba(30,155,233,0.35) 0 28%, transparent 28.3%),
      linear-gradient(135deg, var(--banner-2), var(--banner) 65%);
    box-shadow: 0 14px 34px color-mix(in srgb, var(--banner) 32%, transparent); }
  .banner h1 { color: var(--banner-ink); max-width: 24ch; }
  .b-text { display: flex; flex-direction: column; gap: 8px; min-width: 0; flex: 1 1 320px; }
  .b-eyebrow { font: 700 0.78rem var(--sans); color: var(--banner-muted); }
  .b-meta { color: var(--banner-muted); font-size: 0.93rem; }
  .b-meta b { color: var(--banner-ink); font-weight: 600; }
  .b-pill { align-self: flex-start; font-size: 0.8rem; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.14); border: 1px solid rgba(255, 255, 255, 0.25); }
  .b-ring { position: relative; width: 112px; height: 112px; flex: none; }
  .b-ring-label { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; }
  .b-ring-label .mono { font-size: 1.45rem; font-weight: 600; }
  .b-ring-label span:last-child { font-size: 0.72rem; color: var(--banner-muted); }

  /* quick actions: round icon buttons like a banking app */
  .quick { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; background: var(--surface); border-radius: var(--radius); padding: 16px 8px; box-shadow: var(--shadow); }
  .qa { appearance: none; border: 0; background: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 8px; font: 700 0.78rem/1.2 var(--sans); color: var(--ink-2); text-align: center; padding: 4px 2px; border-radius: 12px; }
  .qa-ico { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); transition: background 0.15s, color 0.15s, transform 0.1s; }
  .qa:hover .qa-ico, .qa.on .qa-ico { background: var(--accent); color: var(--accent-ink); }
  .qa:active .qa-ico { transform: scale(0.94); }

  /* ---------- surfaces ---------- */
  .panel { background: var(--surface); border: 1px solid transparent; border-radius: var(--radius); padding: 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0; box-shadow: var(--shadow); }
  .panel > h3:first-child { padding-bottom: 2px; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 18px; align-items: start; }
  .week-body .grid2 > div { display: flex; flex-direction: column; gap: 10px; min-width: 0; }

  /* KPI strip */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .kpi { background: var(--surface); border: 1px solid transparent; border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; box-shadow: var(--shadow-sm); }
  .kpi-k { font: 700 0.76rem var(--sans); color: var(--muted); }
  .kpi-v { font: 800 1.6rem/1 var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -0.03em; color: var(--ink); }
  .kpi-v small { font-size: 0.78rem; color: var(--muted); font-weight: 400; letter-spacing: 0; }
  .kpi-note { font-size: 0.74rem; color: var(--muted); }
  .bar { display: block; height: 6px; background: var(--sunk); border-radius: 999px; overflow: hidden; flex: 1; min-width: 60px; }
  .bar > span { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); border-radius: 999px; }
  .bar.gold > span { background: var(--gold); }

  /* ---------- checkboxes ---------- */
  .checks { display: flex; flex-direction: column; gap: 1px; }
  .checks.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 2px 16px; }
  .checks.tight { border-top: 1px dashed var(--rule-strong); padding-top: 10px; }
  .chk { display: flex; gap: 11px; align-items: flex-start; padding: 7px 8px; border-radius: 8px; cursor: pointer; color: var(--ink-2); transition: background 0.12s; }
  .chk:hover { background: var(--hover); }
  .chk input { appearance: none; -webkit-appearance: none; width: 18px; height: 18px; margin: 2px 0 0; flex: none; cursor: pointer; border: 1.6px solid var(--rule-strong); border-radius: 5px; background: var(--surface); display: grid; place-content: center; transition: background 0.12s, border-color 0.12s; }
  .chk input::before { content: ""; width: 10px; height: 10px; transform: scale(0); transition: transform 0.12s ease; background: var(--accent-ink); clip-path: polygon(14% 44%, 0 62%, 42% 100%, 100% 22%, 84% 6%, 40% 66%); }
  .chk input:checked { background: var(--accent); border-color: var(--accent); }
  .chk input:checked::before { transform: scale(1); }
  .chk input:hover { border-color: var(--accent); }
  .chk.is-done > span { color: var(--muted); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--muted) 55%, transparent); }
  .chk.inline { display: inline-flex; padding: 4px 8px; align-items: center; }
  .chk.inline input { margin: 0; }

  /* ---------- controls ---------- */
  .btn { appearance: none; border: 1.5px solid var(--accent); background: var(--surface); color: var(--accent); font: 800 0.86rem var(--sans); padding: 8px 18px; min-height: 38px; border-radius: 999px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; transition: background 0.12s, border-color 0.12s, transform 0.08s; }
  .btn:hover { background: var(--accent-soft); text-decoration: none; }
  .btn:active { transform: translateY(1px); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); box-shadow: 0 1px 2px color-mix(in srgb, var(--accent) 40%, transparent); }
  .btn.primary:hover { background: var(--accent-2); border-color: var(--accent-2); }
  .btn.danger { background: var(--bad); color: #fff; border-color: var(--bad); }
  .btn.ghost { background: none; border-color: transparent; color: var(--muted); }
  .btn.ghost:hover { color: var(--ink); background: var(--hover); }
  .btn.sm { padding: 5px 13px; min-height: 32px; font-size: 0.8rem; border-radius: 999px; }
  .btn[disabled] { opacity: 0.5; cursor: not-allowed; }
  .linkish { appearance: none; background: none; border: 0; padding: 0; font: inherit; font-weight: 550; color: var(--accent); cursor: pointer; }
  .linkish:hover { text-decoration: underline; text-underline-offset: 3px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .actions > a { font-size: 0.84rem; font-weight: 600; padding: 5px 4px; }
  .pill { display: inline-flex; align-items: center; gap: 4px; font: 600 0.72rem/1 var(--sans); padding: 5px 9px; border-radius: 999px; background: var(--sunk); color: var(--muted); white-space: nowrap; width: fit-content; }
  .pill.accent { background: var(--accent-soft); color: var(--accent); }
  .pill.warn { background: var(--warn-soft); color: var(--warn); }
  .pill.bad { background: var(--bad-soft); color: var(--bad); }
  .chip { appearance: none; border: 1px solid var(--rule); background: var(--surface); color: var(--ink-2); font: 550 0.8rem var(--sans); padding: 5px 11px; border-radius: 999px; cursor: pointer; text-decoration: none; display: inline-block; transition: border-color 0.12s, color 0.12s, background 0.12s; }
  .chip:hover { border-color: var(--accent-line); color: var(--accent); background: var(--accent-soft); text-decoration: none; }
  .x { appearance: none; border: 0; background: none; color: var(--muted); font-size: 1.1rem; line-height: 1; cursor: pointer; padding: 3px 7px; border-radius: 6px; }
  .x:hover { color: var(--bad); background: var(--bad-soft); }
  .confirm { display: inline-flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 0.84rem; font-weight: 600; color: var(--bad); }
  .note { background: var(--accent-soft); border: 1px solid var(--accent-line); border-radius: 10px; padding: 12px 14px; font-size: 0.86rem; color: var(--ink-2); }
  .bad-text { color: var(--bad); }

  /* ---------- forms ---------- */
  .fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 12px 14px; align-items: end; }
  .field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .field.wide { grid-column: 1 / -1; }
  .field > span { font: 600 0.74rem var(--sans); color: var(--ink-2); }
  input:not([type="checkbox"]):not([type="file"]), select, textarea { font: 400 0.92rem var(--sans); color: var(--ink); background: var(--surface); border: 1px solid var(--rule-strong); border-radius: var(--radius-sm); padding: 8px 11px; min-height: 38px; width: 100%; min-width: 0; transition: border-color 0.12s, box-shadow 0.12s; }
  input::placeholder, textarea::placeholder { color: color-mix(in srgb, var(--muted) 75%, transparent); }
  textarea { resize: vertical; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
  .field.sm { max-width: 150px; }
  .field.grow { flex: 1 1 260px; }
  .inline-form { display: flex; gap: 8px; }
  .file-btn { position: relative; overflow: hidden; }
  .file-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .form { border-color: var(--accent-line); box-shadow: 0 0 0 4px var(--accent-soft); }

  /* ---------- lists ---------- */
  .plan, .plist, .res, .places, .steps, .quotes { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; }
  .plan li { display: grid; grid-template-columns: 62px 1fr; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--rule); align-items: baseline; }
  .plan li:last-child { border-bottom: 0; }
  .plan .mono { color: var(--accent); font-weight: 600; font-size: 0.86rem; }
  .plan li.school .mono, .plan li.school span:last-child { color: var(--gold); font-weight: 600; }
  .plan em { color: var(--muted); font-style: normal; font-size: 0.84rem; }
  .plist li { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--rule); flex-wrap: wrap; }
  .plist li:last-child { border-bottom: 0; }
  .plist li.is-done { opacity: 0.55; }
  .row-actions { display: inline-flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 0.84rem; }
  .panel h4 { margin-top: 2px; }
  .res { gap: 2px; }
  .res li { font-size: 0.9rem; }
  .res li a { display: inline-flex; gap: 6px; align-items: baseline; }
  .res li a::before { content: "↗"; color: var(--muted); font-size: 0.8em; }

  /* ---------- week content ---------- */
  .problem { background: linear-gradient(180deg, var(--accent-soft), color-mix(in srgb, var(--accent-soft) 45%, var(--surface))); border: 1px solid var(--accent-line); border-radius: var(--radius); padding: 18px; display: flex; flex-direction: column; gap: 9px; }
  .problem .eyebrow { color: var(--accent); }
  .problem h4 { font-size: 1.08rem; }
  .problem .chk:hover { background: color-mix(in srgb, var(--surface) 60%, transparent); }
  .builds { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 0.82rem; color: var(--muted); }
  .week-foot { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-end; border-top: 1px solid var(--rule); padding-top: 14px; }
  .practice { border-top: 1px solid var(--rule); padding-top: 18px; }
  .drills, .assess { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .dn { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 6px; background: var(--sunk); color: var(--muted); font-size: 0.72rem; margin-right: 2px; }
  .quiz { display: flex; flex-direction: column; gap: 8px; }
  .quiz-item { border: 1px solid var(--rule); border-radius: 10px; padding: 6px 8px 8px; display: flex; flex-direction: column; gap: 2px; background: var(--surface); }
  .quiz-item > p { padding: 6px 4px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .answer summary { cursor: pointer; font-size: 0.78rem; font-weight: 650; color: var(--accent); padding: 2px 8px; width: fit-content; border-radius: 6px; list-style: none; }
  .answer summary::-webkit-details-marker { display: none; }
  .answer summary::before { content: "▸ "; }
  .answer[open] summary::before { content: "▾ "; }
  .answer summary:hover { background: var(--accent-soft); }
  .answer p { font-size: 0.88rem; background: var(--sunk); border-radius: 8px; padding: 9px 12px; margin: 5px 0 2px; color: var(--ink-2); }
  .carry { background: var(--gold-soft); border: 1px solid var(--gold-line); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 7px; }
  .carry .eyebrow { color: var(--gold); }
  .carry .chk:hover { background: color-mix(in srgb, var(--surface) 55%, transparent); }

  /* ---------- roadmap ---------- */
  .phase { display: flex; flex-direction: column; gap: 8px; }
  .phase-head { display: flex; justify-content: space-between; gap: 16px; align-items: flex-end; flex-wrap: wrap; padding: 20px 0 10px; }
  .phase-head > div:first-child { display: flex; flex-direction: column; gap: 4px; max-width: 70ch; }
  .phase-pct { display: flex; align-items: center; gap: 10px; min-width: 200px; }
  .phase-pct .mono { font-weight: 600; color: var(--accent); }
  .week { background: var(--surface); border: 1px solid transparent; border-radius: 14px; box-shadow: var(--shadow-sm); transition: border-color 0.15s; }
  .week:hover { border-color: var(--rule-strong); }
  .week > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 46px 1fr auto 150px; gap: 14px; align-items: center; padding: 12px 16px; border-radius: 12px; }
  .week > summary::-webkit-details-marker { display: none; }
  .week[open] > summary { border-bottom: 1px solid var(--rule); border-radius: 12px 12px 0 0; }
  .week .wn { font-size: 0.78rem; font-weight: 600; color: var(--muted); background: var(--sunk); border-radius: 7px; padding: 4px 0; text-align: center; }
  .week .wt { font-weight: 600; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .week .wd { font-size: 0.8rem; white-space: nowrap; }
  .week .wp { display: flex; gap: 8px; align-items: center; }
  .week .wp .mono { width: 3.2em; text-align: right; color: var(--muted); }
  .week.current { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .week.current .wn { background: var(--accent); color: var(--accent-ink); }
  .week.done .wn { background: color-mix(in srgb, var(--good) 15%, transparent); color: var(--good); }
  .week.behind .wn { background: var(--warn-soft); color: var(--warn); }
  .week .week-body { border: 0; border-radius: 0 0 12px 12px; box-shadow: none; }

  /* ---------- mentors ---------- */
  .funnel { display: grid; grid-template-columns: repeat(auto-fit, minmax(98px, 1fr)); gap: 8px; }
  .fstage { appearance: none; border: 1px solid var(--rule); background: var(--surface); border-radius: 12px; padding: 10px 12px; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 2px; color: var(--muted); font: 550 0.76rem var(--sans); box-shadow: var(--shadow-sm); transition: border-color 0.12s, background 0.12s; }
  .fstage .mono { font-size: 1.35rem; font-weight: 600; color: var(--ink); }
  .fstage:hover { border-color: var(--accent-line); }
  .fstage.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  .fstage:nth-child(8) .mono { color: var(--gold); }
  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: 10px; background: var(--sunk); }
  .seg button { appearance: none; border: 0; background: none; padding: 6px 12px; font: 600 0.82rem var(--sans); color: var(--muted); cursor: pointer; border-radius: 8px; }
  .seg button:hover { color: var(--ink); }
  .seg button.on { background: var(--surface); color: var(--accent); box-shadow: var(--shadow-sm), 0 0 0 1px var(--rule); }
  .search { max-width: 280px; }
  .pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 14px; align-items: start; }
  .pgrid.wide { grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); }
  .pcard { background: var(--surface); border: 1px solid transparent; border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 12px; box-shadow: var(--shadow); }
  .pcard header { display: flex; gap: 12px; align-items: flex-start; }
  .pc-id { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 2px; }
  .pcard h4 a { color: var(--ink); }
  .avatar { width: 40px; height: 40px; border-radius: 50%; flex: none; display: grid; place-items: center; font: 650 0.85rem var(--sans); background: var(--accent-soft); color: var(--accent); border: 1px solid var(--accent-line); }
  .avatar.gold { background: var(--gold-soft); color: var(--gold); border-color: var(--gold-line); }
  .stage-select { width: auto !important; flex: none; font-size: 0.8rem !important; padding: 5px 8px !important; min-height: 32px !important; }
  .pcard.stage-mentor { border-color: var(--gold-line); box-shadow: 0 0 0 3px var(--gold-soft); }
  .pcard.stage-parked { opacity: 0.6; }
  .pmeta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .next { font-size: 0.87rem; padding: 10px 12px; border-radius: 10px; background: var(--sunk); color: var(--ink-2); }
  .next.accent { background: var(--accent-soft); color: var(--ink); }
  .next.warn { background: var(--warn-soft); color: var(--ink); }
  .good-time { color: var(--good); font-weight: 600; }
  .empty { padding: 28px 0; text-align: center; }
  .email-helper { display: flex; flex-direction: column; gap: 8px; border-top: 1px dashed var(--rule-strong); padding-top: 14px; }
  .linkrow, .patterns { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 0.86rem; }
  .patterns { gap: 6px; }

  /* ---------- finder & messages ---------- */
  .search-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 12px; }
  .scard { border: 1px solid var(--rule); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 9px; background: var(--ground); }
  code.q { font: 0.76rem/1.5 var(--mono); background: var(--surface); border: 1px solid var(--rule); padding: 9px 10px; border-radius: 8px; overflow-wrap: anywhere; color: var(--ink-2); }
  .steps { list-style: decimal; padding-left: 20px; gap: 7px; }
  .steps li::marker { color: var(--accent); font-weight: 700; }
  .places { gap: 12px; }
  .places li { display: flex; flex-direction: column; gap: 2px; }
  .places a { font-weight: 650; }
  .tgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr)); gap: 14px; align-items: start; }
  .tmpl header { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
  pre.msg { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font: 0.9rem/1.6 var(--sans); background: var(--ground); border: 1px solid var(--rule); border-radius: 10px; padding: 14px; max-height: 360px; overflow: auto; color: var(--ink-2); }
  .formula { display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; margin: 0; }
  .formula dt { font: 700 0.72rem var(--sans); text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent-ink); background: var(--accent); border-radius: 6px; padding: 3px 8px; align-self: start; }
  .formula dd { margin: 0; color: var(--ink-2); }
  .quotes { gap: 10px; }
  .quotes li { font-size: 0.88rem; padding: 2px 0 2px 14px; border-left: 3px solid var(--accent-line); color: var(--ink-2); }

  /* ---------- studies ---------- */
  .timetable { display: grid; grid-template-columns: repeat(7, minmax(120px, 1fr)); gap: 8px; overflow-x: auto; padding-bottom: 4px; }
  .tday { display: flex; flex-direction: column; gap: 6px; min-width: 0; padding: 8px; border-radius: 10px; background: var(--ground); min-height: 90px; }
  .tclass { position: relative; background: var(--surface); border: 1px solid var(--gold-line); border-left: 3px solid var(--gold); border-radius: 8px; padding: 8px 26px 8px 10px; display: flex; flex-direction: column; gap: 2px; font-size: 0.84rem; }
  .tclass .x { position: absolute; top: 4px; right: 2px; }

  /* ---------- projects & progress ---------- */
  .project.shipped { border-color: var(--gold-line); box-shadow: 0 0 0 3px var(--gold-soft); }
  .prow { display: flex; align-items: center; gap: 12px; }
  .plabel { flex: 0 0 min(46%, 210px); font-size: 0.87rem; color: var(--ink-2); }
  .weekgrid { display: grid; grid-template-columns: repeat(13, 1fr); gap: 5px; }
  .wcell { appearance: none; aspect-ratio: 1; max-width: 100%; border: 1px solid var(--rule); border-radius: 7px; cursor: pointer; padding: 0; background: color-mix(in srgb, var(--accent) calc(var(--p) * 100%), var(--sunk)); color: var(--muted); font: 600 0.66rem var(--mono); display: grid; place-items: center; transition: transform 0.1s; }
  .wcell:hover { transform: scale(1.08); }
  .wcell[style*="--p:1.00"], .wcell[style*="--p:0.9"], .wcell[style*="--p:0.8"], .wcell[style*="--p:0.7"], .wcell[style*="--p:0.6"], .wcell[style*="--p:0.5"] { color: var(--accent-ink); border-color: transparent; }
  .wcell.now { outline: 2px solid var(--gold); outline-offset: 2px; }
  .chart-wrap { overflow-x: auto; }
  .chart { width: 100%; min-width: 560px; height: auto; display: block; }
  .chart .grid { stroke: var(--rule); stroke-width: 1; }
  .chart .goal { stroke: var(--gold); stroke-dasharray: 4 4; stroke-width: 1.5; }
  .chart .tick { fill: var(--muted); font: 10px var(--mono); }
  .chart .hb { fill: var(--accent); }
  .chart .cur { fill: var(--gold); }

  /* ---------- settings ---------- */
  .routine { display: flex; flex-direction: column; gap: 8px; }
  .rrow { display: grid; grid-template-columns: 140px 120px 90px 1fr auto; gap: 8px; align-items: center; }
  .linkcol { display: flex; flex-direction: column; gap: 4px; font-size: 0.9rem; }
  .linkcol a { padding: 8px 12px; border-radius: 9px; border: 1px solid var(--rule); background: var(--ground); }
  .linkcol a:hover { border-color: var(--accent-line); background: var(--accent-soft); text-decoration: none; }
  .sync { font: 600 0.78rem var(--sans); padding: 5px 10px; border-radius: 999px; background: var(--sunk); color: var(--muted); display: inline-block; }
  .sync.ok { background: color-mix(in srgb, var(--good) 13%, transparent); color: var(--good); }
  .sync.warn { background: var(--warn-soft); color: var(--warn); }
  .sync.bad { background: var(--bad-soft); color: var(--bad); }

  .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--ground); padding: 11px 18px; border-radius: 12px; font-weight: 600; font-size: 0.88rem; z-index: 30; max-width: calc(100% - 32px); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25); animation: toast-in 0.2s ease; }
  @keyframes toast-in { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }

  @media (max-width: 640px) {
    .banner { padding: 22px 20px; border-radius: 20px; }
    .b-ring { width: 88px; height: 88px; }
    .b-ring .ring { width: 88px; height: 88px; }
    .quick { padding: 14px 4px; gap: 2px; }
    .qa { font-size: 0.7rem; }
    .qa-ico { width: 44px; height: 44px; }
    .toast { bottom: calc(86px + env(safe-area-inset-bottom, 0px)); }
    .panel { padding: 16px; }
    .week > summary { grid-template-columns: 40px 1fr; gap: 6px 12px; }
    .week .wd, .week .wp { grid-column: 2; }
    .rrow { grid-template-columns: 1fr 1fr 76px auto; }
    .rrow input[data-field="label"] { grid-column: 1 / -1; grid-row: 2; }
    .pcard header { flex-wrap: wrap; }
    .stage-select { width: 100% !important; }
    .search { max-width: none; flex: 1 1 100%; }
    .weekgrid { gap: 3px; }
    .wcell { font-size: 0.56rem; border-radius: 4px; }
    .timetable { grid-template-columns: repeat(7, 140px); }
  }

  /* ---------- page header + sub-tabs ---------- */
  .view-in { display: flex; flex-direction: column; gap: 18px; animation: view-in 0.28s cubic-bezier(.2,.7,.2,1); }
  @keyframes view-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .phead { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px 24px; flex-wrap: wrap; }
  .ph-text { display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1 1 380px; }
  .ph-text .eyebrow { color: var(--accent); }
  .ph-text .lede { font-size: 0.93rem; }
  .ph-right { display: flex; align-items: center; gap: 10px; min-width: 0; max-width: 100%; }
  .segtabs { display: inline-flex; gap: 2px; padding: 4px; border-radius: 999px; background: var(--surface); box-shadow: var(--shadow); overflow-x: auto; scrollbar-width: none; max-width: 100%; }
  .segtabs::-webkit-scrollbar { display: none; }
  .st { appearance: none; border: 0; background: none; cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 7px; padding: 8px 14px; border-radius: 999px; font: 700 0.84rem var(--sans); color: var(--muted); transition: background 0.18s, color 0.18s; }
  .st:hover { color: var(--ink); }
  .st.on { background: var(--accent); color: var(--accent-ink); box-shadow: 0 4px 12px color-mix(in srgb, var(--accent) 35%, transparent); }
  .st-b { font: 800 0.7rem/1 var(--sans); padding: 3px 7px; border-radius: 999px; background: var(--sunk); color: var(--muted); }
  .st.on .st-b { background: rgba(255, 255, 255, 0.22); color: var(--accent-ink); }
  .narrow { max-width: 680px; }
  .stack { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .ink { color: var(--ink); }
  .empty-state { align-items: center; text-align: center; padding: 36px 20px; }
  body.locked { overflow: hidden; }

  /* ---------- learning card (Today) ---------- */
  .today-top { display: grid; grid-template-columns: minmax(0, 400px) minmax(0, 1fr); gap: 18px; align-items: stretch; }
  .lcard { position: relative; overflow: hidden; aspect-ratio: 1.586; max-width: 100%; border-radius: 22px; padding: 22px 24px; color: #fff; display: flex; flex-direction: column; justify-content: space-between;
    background:
      radial-gradient(circle at 110% -20%, rgba(255,255,255,0.22) 0 30%, transparent 30.4%),
      radial-gradient(circle at 110% -20%, rgba(255,255,255,0.09) 0 48%, transparent 48.4%),
      radial-gradient(circle at -15% 120%, rgba(30,155,233,0.55) 0 38%, transparent 38.4%),
      linear-gradient(135deg, #0b56e0 0%, var(--banner) 55%, #001d63 100%);
    box-shadow: 0 18px 40px rgba(0, 40, 140, 0.35), inset 0 1px 0 rgba(255,255,255,0.25); }
  .lcard::after { content: ""; position: absolute; inset: 0; background: linear-gradient(115deg, transparent 35%, rgba(255,255,255,0.14) 50%, transparent 65%); transform: translateX(-60%); animation: sheen 6s ease-in-out 1s infinite; pointer-events: none; }
  @keyframes sheen { 0%, 70% { transform: translateX(-60%); } 100% { transform: translateX(60%); } }
  .lc-top, .lc-mid, .lc-bottom { display: flex; align-items: center; justify-content: space-between; gap: 12px; position: relative; z-index: 1; }
  .lc-brand { display: inline-flex; align-items: center; gap: 9px; font: 800 0.86rem var(--sans); letter-spacing: 0.02em; }
  .mark.sm { width: 26px; height: 26px; font-size: 10px; }
  .lc-wave { width: 24px; height: 24px; fill: none; stroke: rgba(255,255,255,0.85); stroke-width: 1.8; stroke-linecap: round; }
  .lc-chip { width: 44px; height: 33px; border-radius: 7px; background: linear-gradient(135deg, #f6dc8c, #c9a14a 55%, #f2d27a); position: relative; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.15); }
  .lc-chip::before { content: ""; position: absolute; inset: 7px 9px; border: 1px solid rgba(90, 60, 10, 0.45); border-radius: 4px; }
  .lc-chip::after { content: ""; position: absolute; left: 50%; top: 4px; bottom: 4px; border-left: 1px solid rgba(90, 60, 10, 0.45); }
  .lc-phase { font: 700 0.78rem var(--sans); color: rgba(255,255,255,0.82); text-align: right; }
  .lc-num { position: relative; z-index: 1; display: flex; gap: clamp(10px, 3vw, 20px); font: 700 clamp(1.1rem, 3.2vw, 1.45rem)/1 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; letter-spacing: 0.12em; text-shadow: 0 1px 1px rgba(0,0,0,0.3); }
  .lc-bottom small { display: block; font: 700 0.58rem var(--sans); letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255,255,255,0.65); }
  .lc-bottom b { font: 800 0.86rem var(--sans); letter-spacing: 0.06em; white-space: nowrap; }
  .lc-ring { position: relative; width: 46px; height: 46px; flex: none; }
  .lc-ring span { position: absolute; inset: 0; display: grid; place-items: center; font: 800 0.74rem var(--sans); }
  .focus { justify-content: center; gap: 10px; }
  .focus h2 { font-size: clamp(1.3rem, 2.4vw, 1.7rem); letter-spacing: -0.02em; }
  .focus-bar { display: flex; align-items: center; gap: 10px; max-width: 420px; }
  .focus-bar .bar { height: 8px; }
  .tri { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 18px; align-items: start; }
  .tri h3 .ico, .panel > h3 .ico { width: 18px; height: 18px; color: var(--accent); align-self: center; }
  .lh { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-top: 4px; }
  .lh.accent { color: var(--accent); }
  .lh.warn { color: var(--warn); }
  .pl-who { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .pl-note { display: block; }
  .avatar.xs { width: 30px; height: 30px; font-size: 0.7rem; }
  .avatar.sq { border-radius: 10px; }
  .more-row { justify-content: flex-start !important; }

  /* ---------- week panel ---------- */
  .wb-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
  .wb-tabs { box-shadow: none; background: var(--sunk); }
  .wb-pane { animation: view-in 0.22s ease; }
  .pane-note { display: flex; gap: 8px; align-items: center; font-size: 0.86rem; color: var(--muted); margin-bottom: 6px; }
  .pane-note .ico { width: 16px; height: 16px; color: var(--accent); }
  .mtask { background: var(--sunk); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
  .review-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 10px; }

  /* ---------- roadmap phase picker ---------- */
  .phase-picker { display: grid; grid-template-columns: repeat(6, minmax(150px, 1fr)); gap: 10px; overflow-x: auto; padding: 2px 2px 6px; scrollbar-width: thin; }
  .pp { appearance: none; border: 1.5px solid transparent; background: var(--surface); border-radius: 16px; padding: 12px; display: flex; align-items: center; gap: 10px; cursor: pointer; text-align: left; color: var(--ink); box-shadow: var(--shadow-sm); transition: border-color 0.15s, transform 0.15s; min-width: 0; }
  .pp:hover { transform: translateY(-1px); }
  .pp.on { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
  .pp-ring { position: relative; width: 38px; height: 38px; flex: none; }
  .pp-ring > span { position: absolute; inset: 0; display: grid; place-items: center; font: 800 0.82rem var(--sans); color: var(--accent); }
  .pp-ring.big { width: 76px; height: 76px; }
  .pp-ring.big > span { font-size: 0.95rem; color: var(--ink); }
  .pp-text { display: flex; flex-direction: column; min-width: 0; }
  .pp-text b { font-size: 0.84rem; line-height: 1.2; }
  .pp-text small { font-size: 0.72rem; color: var(--muted); }
  .pp.cur .pp-text small::after { content: " · now"; color: var(--accent); font-weight: 800; }

  /* ---------- mentors ---------- */
  .fs-arrow { position: absolute; right: -9px; top: 50%; width: 10px; height: 10px; border-top: 2px solid var(--rule-strong); border-right: 2px solid var(--rule-strong); transform: translateY(-50%) rotate(45deg); z-index: 1; background: none; }
  .fstage { position: relative; }
  .funnel { grid-template-columns: repeat(9, minmax(92px, 1fr)); overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
  .search-wrap { position: relative; display: flex; align-items: center; flex: 1 1 240px; max-width: 340px; }
  .search-wrap .ico { position: absolute; left: 12px; width: 16px; height: 16px; color: var(--muted); pointer-events: none; }
  .search-wrap .search { padding-left: 36px !important; border-radius: 999px !important; max-width: none; }
  .pipeline-count { margin-left: auto; }
  .pc-actions { justify-content: flex-start; }
  .kebab { position: relative; }
