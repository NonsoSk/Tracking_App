<title>Fintech ML Ledger</title>
<meta name="description" content="A 52-week Python & machine learning plan for fintech, with a mentor CRM, studies planner and reminders.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
  /* ---------- tokens ---------- */
  :root {
    --ground: #f3f6fb;
    --surface: #ffffff;
    --sunk: #eef2f8;
    --hover: #e7edf7;
    --ink: #0e1a2e;
    --ink-2: #33425a;
    --muted: #5d6c84;
    --rule: #dfe5ef;
    --rule-strong: #c5cfdf;
    --accent: #1f4fd6;
    --accent-2: #173ea9;
    --accent-ink: #ffffff;
    --accent-soft: #e8efff;
    --accent-line: #b9cbff;
    --banner: #0f2a6e;
    --banner-2: #1b44b8;
    --banner-ink: #ffffff;
    --banner-muted: #b9c8f2;
    --gold: #a86a10;
    --gold-soft: #fbf1dc;
    --gold-line: #ecd3a1;
    --good: #15803d;
    --warn: #a3580a;
    --warn-soft: #fdf0dd;
    --bad: #be3a2e;
    --bad-soft: #fde8e5;
    --focus: #3b82f6;
    --shadow-sm: 0 1px 2px rgba(14, 26, 46, 0.05);
    --shadow: 0 1px 2px rgba(14, 26, 46, 0.04), 0 4px 16px rgba(14, 26, 46, 0.06);
    --radius: 14px;
    --radius-sm: 9px;
    --sans: "Onest", "Segoe UI", system-ui, -apple-system, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --ground: #0a1120; --surface: #101a2c; --sunk: #152138; --hover: #1a2843; --ink: #e7edf7; --ink-2: #c3cee0; --muted: #8b9ab4;
      --rule: #1f2c46; --rule-strong: #2f3f5e; --accent: #6b93ff; --accent-2: #8eadff; --accent-ink: #081330; --accent-soft: #16254a; --accent-line: #2c4585;
      --banner: #122a66; --banner-2: #1c3f99; --banner-ink: #ffffff; --banner-muted: #aebfeb;
      --gold: #e2b25a; --gold-soft: #2b2415; --gold-line: #5a4622; --good: #4ade80; --warn: #f0a44b; --warn-soft: #2e2213; --bad: #f28b7d; --bad-soft: #321b1a; --focus: #7aa7ff;
      --shadow-sm: none; --shadow: 0 0 0 1px rgba(255, 255, 255, 0.02), 0 8px 24px rgba(0, 0, 0, 0.35);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --ground: #0a1120; --surface: #101a2c; --sunk: #152138; --hover: #1a2843; --ink: #e7edf7; --ink-2: #c3cee0; --muted: #8b9ab4;
    --rule: #1f2c46; --rule-strong: #2f3f5e; --accent: #6b93ff; --accent-2: #8eadff; --accent-ink: #081330; --accent-soft: #16254a; --accent-line: #2c4585;
    --banner: #122a66; --banner-2: #1c3f99; --banner-ink: #ffffff; --banner-muted: #aebfeb;
    --gold: #e2b25a; --gold-soft: #2b2415; --gold-line: #5a4622; --good: #4ade80; --warn: #f0a44b; --warn-soft: #2e2213; --bad: #f28b7d; --bad-soft: #321b1a; --focus: #7aa7ff;
    --shadow-sm: none; --shadow: 0 0 0 1px rgba(255, 255, 255, 0.02), 0 8px 24px rgba(0, 0, 0, 0.35);
  }

  /* ---------- base ---------- */
  * { box-sizing: border-box; }
  html, body { background: var(--ground); }
  body { margin: 0; color: var(--ink); font: 15px/1.55 var(--sans); -webkit-font-smoothing: antialiased; font-feature-settings: "ss01"; }
  a { color: var(--accent); text-decoration: none; font-weight: 500; }
  a:hover { text-decoration: underline; text-underline-offset: 3px; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
  h1, h2, h3, h4 { margin: 0; line-height: 1.15; text-wrap: balance; color: var(--ink); }
  h1 { font-size: clamp(1.65rem, 3.6vw, 2.35rem); font-weight: 750; letter-spacing: -0.03em; }
  h2 { font-size: 1.3rem; font-weight: 700; letter-spacing: -0.02em; }
  h3 { font-size: 1.02rem; font-weight: 650; letter-spacing: -0.01em; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  h4 { font-size: 0.97rem; font-weight: 650; letter-spacing: -0.005em; }
  p { margin: 0; }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); font-weight: 400; }
  .small { font-size: 0.84rem; }
  .eyebrow { font: 600 0.7rem/1.3 var(--sans); text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); }

  /* ---------- shell: sidebar on desktop, top bar on phones ---------- */
  .shell { display: grid; grid-template-columns: minmax(0, 1fr); min-height: 100%; }
  .side { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: color-mix(in srgb, var(--ground) 88%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--rule); padding: 12px 16px 0; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 750; letter-spacing: -0.02em; font-size: 1rem; white-space: nowrap; }
  .brand small { display: block; font: 500 0.72rem var(--sans); color: var(--muted); letter-spacing: 0; }
  .mark { width: 32px; height: 32px; border-radius: 9px; background: linear-gradient(145deg, var(--accent), var(--banner)); color: #fff; display: grid; place-items: center; font: 600 12px/1 var(--mono); box-shadow: 0 2px 8px color-mix(in srgb, var(--accent) 35%, transparent); flex: none; }
  .tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; margin-inline: -16px; padding: 0 16px 8px; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { appearance: none; border: 0; background: none; color: var(--muted); font: 550 0.88rem var(--sans); padding: 7px 12px; border-radius: 999px; cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 7px; transition: background 0.15s, color 0.15s; }
  .tab:hover { color: var(--ink); background: var(--hover); }
  .tab.on { color: var(--accent-ink); background: var(--accent); }
  .ico { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .sidefoot { display: none; }
  main { width: 100%; max-width: 1120px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 72px; display: flex; flex-direction: column; gap: 18px; min-width: 0; }

  @media (min-width: 980px) {
    .shell { grid-template-columns: 256px minmax(0, 1fr); }
    .side { height: 100vh; height: 100dvh; top: 0; border-bottom: 0; border-right: 1px solid var(--rule); padding: 22px 14px 18px; gap: 22px; background: var(--surface); backdrop-filter: none; }
    .brand { padding-inline: 8px; }
    .tabs { flex-direction: column; margin: 0; padding: 0; gap: 2px; overflow: visible; }
    .tab { border-radius: 10px; padding: 9px 12px; font-size: 0.92rem; }
    .tab.on { background: var(--accent-soft); color: var(--accent); font-weight: 650; }
    .tab.on .ico { stroke-width: 2.1; }
    .sidefoot { display: flex; margin-top: auto; align-items: center; gap: 12px; padding: 14px 12px; border-radius: 12px; background: var(--sunk); }
    .sf-ring { position: relative; width: 52px; height: 52px; flex: none; }
    .sf-ring .mono { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 600; font-size: 0.95rem; }
    .sf-k { font-weight: 650; font-size: 0.88rem; }
    .sf-v { font-size: 0.78rem; color: var(--muted); }
    main { padding-inline: 36px; padding-block: 32px 80px; }
  }

  /* ---------- rings ---------- */
  .ring { display: block; }
  .ring circle { fill: none; }
  .ring-bg { stroke: var(--rule); }
  .ring-fg { stroke: var(--accent); stroke-linecap: round; transition: stroke-dasharray 0.4s ease; }
  .ring.on-dark .ring-bg { stroke: rgba(255, 255, 255, 0.18); }
  .ring.on-dark .ring-fg { stroke: #ffffff; }

  /* ---------- page headers ---------- */
  .hero { display: flex; flex-direction: column; gap: 6px; padding-block: 4px 2px; }
  .hero .eyebrow { color: var(--accent); }
  .lede { max-width: 70ch; color: var(--muted); font-size: 1rem; }

  /* Today banner: the one bold moment, a blue ledger sheet */
  .banner { position: relative; overflow: hidden; border-radius: 18px; color: var(--banner-ink); padding: 26px 26px; display: flex; gap: 24px; align-items: center; justify-content: space-between; flex-wrap: wrap;
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.055) 0 1px, transparent 1px 28px),
      repeating-linear-gradient(90deg, rgba(255,255,255,0.035) 0 1px, transparent 1px 28px),
      radial-gradient(120% 140% at 100% 0%, var(--banner-2) 0%, var(--banner) 60%);
    box-shadow: 0 10px 30px color-mix(in srgb, var(--banner) 30%, transparent); }
  .banner h1 { color: var(--banner-ink); max-width: 24ch; }
  .b-text { display: flex; flex-direction: column; gap: 8px; min-width: 0; flex: 1 1 320px; }
  .b-eyebrow { font: 600 0.74rem var(--sans); letter-spacing: 0.08em; text-transform: uppercase; color: var(--banner-muted); }
  .b-meta { color: var(--banner-muted); font-size: 0.93rem; }
  .b-meta b { color: var(--banner-ink); font-weight: 600; }
  .b-pill { align-self: flex-start; font-size: 0.8rem; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.14); border: 1px solid rgba(255, 255, 255, 0.25); }
  .b-ring { position: relative; width: 112px; height: 112px; flex: none; }
  .b-ring-label { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; }
  .b-ring-label .mono { font-size: 1.45rem; font-weight: 600; }
  .b-ring-label span:last-child { font-size: 0.72rem; color: var(--banner-muted); }

  /* ---------- surfaces ---------- */
  .panel { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); padding: 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0; box-shadow: var(--shadow-sm); }
  .panel > h3:first-child { padding-bottom: 2px; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 18px; align-items: start; }
  .week-body .grid2 > div { display: flex; flex-direction: column; gap: 10px; min-width: 0; }

  /* KPI strip */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .kpi { background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; box-shadow: var(--shadow-sm); }
  .kpi-k { font: 600 0.68rem var(--sans); text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); }
  .kpi-v { font: 600 1.55rem/1 var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -0.03em; color: var(--ink); }
  .kpi-v small { font-size: 0.78rem; color: var(--muted); font-weight: 400; letter-spacing: 0; }
  .kpi-note { font-size: 0.74rem; color: var(--muted); }
  .bar { display: block; height: 6px; background: var(--sunk); border-radius: 999px; overflow: hidden; flex: 1; min-width: 60px; }
  .bar > span { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); border-radius: 999px; }
  .bar.gold > span { background: var(--gold); }

  /* ---------- checkboxes ---------- */
  .checks { display: flex; flex-direction: column; gap: 1px; }
  .checks.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 2px 16px; }
  .checks.tight { border-top: 1px dashed var(--rule-strong); padding-top: 10px; }
  .chk { display: flex; gap: 11px; align-items: flex-start; padding: 7px 8px; border-radius: 8px; cursor: pointer; color: var(--ink-2); transition: background 0.12s; }
  .chk:hover { background: var(--hover); }
  .chk input { appearance: none; -webkit-appearance: none; width: 18px; height: 18px; margin: 2px 0 0; flex: none; cursor: pointer; border: 1.6px solid var(--rule-strong); border-radius: 5px; background: var(--surface); display: grid; place-content: center; transition: background 0.12s, border-color 0.12s; }
  .chk input::before { content: ""; width: 10px; height: 10px; transform: scale(0); transition: transform 0.12s ease; background: var(--accent-ink); clip-path: polygon(14% 44%, 0 62%, 42% 100%, 100% 22%, 84% 6%, 40% 66%); }
  .chk input:checked { background: var(--accent); border-color: var(--accent); }
  .chk input:checked::before { transform: scale(1); }
  .chk input:hover { border-color: var(--accent); }
  .chk.is-done > span { color: var(--muted); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--muted) 55%, transparent); }
  .chk.inline { display: inline-flex; padding: 4px 8px; align-items: center; }
  .chk.inline input { margin: 0; }

  /* ---------- controls ---------- */
  .btn { appearance: none; border: 1px solid var(--rule-strong); background: var(--surface); color: var(--ink); font: 600 0.86rem var(--sans); padding: 8px 14px; min-height: 36px; border-radius: var(--radius-sm); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; transition: background 0.12s, border-color 0.12s, transform 0.08s; }
  .btn:hover { background: var(--hover); text-decoration: none; }
  .btn:active { transform: translateY(1px); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); box-shadow: 0 1px 2px color-mix(in srgb, var(--accent) 40%, transparent); }
  .btn.primary:hover { background: var(--accent-2); border-color: var(--accent-2); }
  .btn.danger { background: var(--bad); color: #fff; border-color: var(--bad); }
  .btn.ghost { background: none; border-color: transparent; color: var(--muted); }
  .btn.ghost:hover { color: var(--ink); background: var(--hover); }
  .btn.sm { padding: 5px 11px; min-height: 30px; font-size: 0.8rem; border-radius: 8px; }
  .btn[disabled] { opacity: 0.5; cursor: not-allowed; }
  .linkish { appearance: none; background: none; border: 0; padding: 0; font: inherit; font-weight: 550; color: var(--accent); cursor: pointer; }
  .linkish:hover { text-decoration: underline; text-underline-offset: 3px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .actions > a { font-size: 0.84rem; font-weight: 600; padding: 5px 4px; }
  .pill { display: inline-flex; align-items: center; gap: 4px; font: 600 0.72rem/1 var(--sans); padding: 5px 9px; border-radius: 999px; background: var(--sunk); color: var(--muted); white-space: nowrap; width: fit-content; }
  .pill.accent { background: var(--accent-soft); color: var(--accent); }
  .pill.warn { background: var(--warn-soft); color: var(--warn); }
  .pill.bad { background: var(--bad-soft); color: var(--bad); }
  .chip { appearance: none; border: 1px solid var(--rule); background: var(--surface); color: var(--ink-2); font: 550 0.8rem var(--sans); padding: 5px 11px; border-radius: 999px; cursor: pointer; text-decoration: none; display: inline-block; transition: border-color 0.12s, color 0.12s, background 0.12s; }
  .chip:hover { border-color: var(--accent-line); color: var(--accent); background: var(--accent-soft); text-decoration: none; }
  .x { appearance: none; border: 0; background: none; color: var(--muted); font-size: 1.1rem; line-height: 1; cursor: pointer; padding: 3px 7px; border-radius: 6px; }
  .x:hover { color: var(--bad); background: var(--bad-soft); }
  .confirm { display: inline-flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 0.84rem; font-weight: 600; color: var(--bad); }
  .note { background: var(--accent-soft); border: 1px solid var(--accent-line); border-radius: 10px; padding: 12px 14px; font-size: 0.86rem; color: var(--ink-2); }
  .bad-text { color: var(--bad); }

  /* ---------- forms ---------- */
  .fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 12px 14px; align-items: end; }
  .field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .field.wide { grid-column: 1 / -1; }
  .field > span { font: 600 0.74rem var(--sans); color: var(--ink-2); }
  input:not([type="checkbox"]):not([type="file"]), select, textarea { font: 400 0.92rem var(--sans); color: var(--ink); background: var(--surface); border: 1px solid var(--rule-strong); border-radius: var(--radius-sm); padding: 8px 11px; min-height: 38px; width: 100%; min-width: 0; transition: border-color 0.12s, box-shadow 0.12s; }
  input::placeholder, textarea::placeholder { color: color-mix(in srgb, var(--muted) 75%, transparent); }
  textarea { resize: vertical; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
  .field.sm { max-width: 150px; }
  .field.grow { flex: 1 1 260px; }
  .inline-form { display: flex; gap: 8px; }
  .file-btn { position: relative; overflow: hidden; }
  .file-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .form { border-color: var(--accent-line); box-shadow: 0 0 0 4px var(--accent-soft); }

  /* ---------- lists ---------- */
  .plan, .plist, .res, .places, .steps, .quotes { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; }
  .plan li { display: grid; grid-template-columns: 62px 1fr; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--rule); align-items: baseline; }
  .plan li:last-child { border-bottom: 0; }
  .plan .mono { color: var(--accent); font-weight: 600; font-size: 0.86rem; }
  .plan li.school .mono, .plan li.school span:last-child { color: var(--gold); font-weight: 600; }
  .plan em { color: var(--muted); font-style: normal; font-size: 0.84rem; }
  .plist li { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--rule); flex-wrap: wrap; }
  .plist li:last-child { border-bottom: 0; }
  .plist li.is-done { opacity: 0.55; }
  .row-actions { display: inline-flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 0.84rem; }
  .panel h4 { margin-top: 2px; }
  .res { gap: 2px; }
  .res li { font-size: 0.9rem; }
  .res li a { display: inline-flex; gap: 6px; align-items: baseline; }
  .res li a::before { content: "↗"; color: var(--muted); font-size: 0.8em; }

  /* ---------- week content ---------- */
  .problem { background: linear-gradient(180deg, var(--accent-soft), color-mix(in srgb, var(--accent-soft) 45%, var(--surface))); border: 1px solid var(--accent-line); border-radius: var(--radius); padding: 18px; display: flex; flex-direction: column; gap: 9px; }
  .problem .eyebrow { color: var(--accent); }
  .problem h4 { font-size: 1.08rem; }
  .problem .chk:hover { background: color-mix(in srgb, var(--surface) 60%, transparent); }
  .builds { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 0.82rem; color: var(--muted); }
  .week-foot { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-end; border-top: 1px solid var(--rule); padding-top: 14px; }
  .practice { border-top: 1px solid var(--rule); padding-top: 18px; }
  .drills, .assess { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .dn { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 6px; background: var(--sunk); color: var(--muted); font-size: 0.72rem; margin-right: 2px; }
  .quiz { display: flex; flex-direction: column; gap: 8px; }
  .quiz-item { border: 1px solid var(--rule); border-radius: 10px; padding: 6px 8px 8px; display: flex; flex-direction: column; gap: 2px; background: var(--surface); }
  .quiz-item > p { padding: 6px 4px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .answer summary { cursor: pointer; font-size: 0.78rem; font-weight: 650; color: var(--accent); padding: 2px 8px; width: fit-content; border-radius: 6px; list-style: none; }
  .answer summary::-webkit-details-marker { display: none; }
  .answer summary::before { content: "▸ "; }
  .answer[open] summary::before { content: "▾ "; }
  .answer summary:hover { background: var(--accent-soft); }
  .answer p { font-size: 0.88rem; background: var(--sunk); border-radius: 8px; padding: 9px 12px; margin: 5px 0 2px; color: var(--ink-2); }
  .carry { background: var(--gold-soft); border: 1px solid var(--gold-line); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 7px; }
  .carry .eyebrow { color: var(--gold); }
  .carry .chk:hover { background: color-mix(in srgb, var(--surface) 55%, transparent); }

  /* ---------- roadmap ---------- */
  .phase { display: flex; flex-direction: column; gap: 8px; }
  .phase-head { display: flex; justify-content: space-between; gap: 16px; align-items: flex-end; flex-wrap: wrap; padding: 20px 0 10px; }
  .phase-head > div:first-child { display: flex; flex-direction: column; gap: 4px; max-width: 70ch; }
  .phase-pct { display: flex; align-items: center; gap: 10px; min-width: 200px; }
  .phase-pct .mono { font-weight: 600; color: var(--accent); }
  .week { background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; box-shadow: var(--shadow-sm); transition: border-color 0.15s; }
  .week:hover { border-color: var(--rule-strong); }
  .week > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 46px 1fr auto 150px; gap: 14px; align-items: center; padding: 12px 16px; border-radius: 12px; }
  .week > summary::-webkit-details-marker { display: none; }
