[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "recruiter-agent"
version = "0.1.0"
description = "An evidence-grounded AI recruiting agent: screens resumes against a job description with RAG, LangGraph and guardrails, served with FastAPI and deployable to AWS Lambda."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "langchain-core>=0.3",
    "langgraph>=0.2",
    "mangum>=0.17",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "rank-bm25>=0.2.2",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
ollama = ["langchain-ollama>=0.2"]
bedrock = ["langchain-aws>=0.2", "boto3>=1.34"]
dev = [
    "boto3>=1.34",
    "cfn-lint>=1.0",
    "httpx>=0.27",
    "moto[dynamodb]>=5.0",
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["SIM905"]  # a split string reads better than a 30-item list literal
