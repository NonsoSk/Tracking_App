{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<div class="page-header"><h1>Change password</h1></div>
<div class="card" style="max-width:520px"><div class="card-body">
  <form method="post">{% csrf_token %}
    {% for f in form %}<div class="mb-3"><label class="form-label small fw-semibold">{{ f.label }}</label><input type="password" name="{{ f.html_name }}" class="form-control" required>{% for e in f.errors %}<div class="invalid-feedback d-block">{{ e }}</div>{% endfor %}</div>{% endfor %}
    <button class="btn btn-primary">Change password</button>
  </form>
</div></div>
{% endblock %}
