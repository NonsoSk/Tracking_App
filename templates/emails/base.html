<!doctype html>
<html><body style="margin:0;background:#f3f5f9;font-family:Segoe UI,Arial,sans-serif;color:#1e293b">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f3f5f9;padding:24px 0"><tr><td align="center">
<table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;background:#ffffff;border-radius:12px;overflow:hidden;border:1px solid #e3e8ef">
  <tr><td style="background:#0b3d6e;color:#ffffff;padding:18px 24px;font-size:15px"><strong>{{ company }}</strong><br><span style="font-size:12px;opacity:.8">HR &amp; A Department · {{ portal }}</span></td></tr>
  <tr><td style="padding:24px">
    <h2 style="font-size:18px;margin:0 0 14px">{{ subject }}</h2>
    <div style="font-size:14px;line-height:1.6;white-space:pre-line">{{ body }}</div>
    {% if action_url %}<p style="margin:24px 0 8px"><a href="{{ action_url }}" style="background:#1b9e5a;color:#ffffff;padding:11px 20px;border-radius:8px;text-decoration:none;font-weight:600;display:inline-block">{{ action_label }}</a></p>
    <p style="font-size:12px;color:#64748b">Or open: {{ action_url }}</p>{% endif %}
  </td></tr>
  <tr><td style="padding:14px 24px;background:#f8fafc;color:#64748b;font-size:11px">This message was sent by the {{ company }} recruitment portal. {{ company }} never asks candidates for payment.</td></tr>
</table></td></tr></table>
</body></html>
