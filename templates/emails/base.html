<!doctype html>
<html lang="en"><body style="margin:0;background:#F2F4F8;font-family:'Nunito Sans','Segoe UI',Arial,sans-serif;color:#1A1F36">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F2F4F8;padding:32px 0"><tr><td align="center">
<table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;background:#FFFFFF;border-radius:16px;overflow:hidden;border:1px solid #E3E7F0">
  <tr><td style="background:#0033A1;color:#FFFFFF;padding:20px 28px;font-size:15px"><strong style="font-size:16px">{{ company }}</strong><br><span style="font-size:12px;color:#C9D6F1">HR &amp; A Department · {{ portal }}</span></td></tr>
  <tr><td style="padding:28px">
    <h2 style="font-size:20px;line-height:1.3;margin:0 0 16px;color:#1A1F36">{{ subject }}</h2>
    <div style="font-size:15px;line-height:1.6;color:#3C4462;white-space:pre-line">{{ body }}</div>
    {% if action_url %}<p style="margin:28px 0 8px"><a href="{{ action_url }}" style="background:#0033A1;color:#FFFFFF;padding:12px 22px;border-radius:10px;text-decoration:none;font-weight:700;display:inline-block">{{ action_label }}</a></p>
    <p style="font-size:12px;color:#5F6785">Or open: {{ action_url }}</p>{% endif %}
  </td></tr>
  <tr><td style="padding:16px 28px;background:#F3F6FC;color:#5F6785;font-size:12px">This message was sent by the {{ company }} recruitment portal. {{ company }} never asks candidates for payment at any stage of recruitment.</td></tr>
</table></td></tr></table>
</body></html>
