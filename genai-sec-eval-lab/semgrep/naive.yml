# Baseline: plain source-to-sink taint, the shape of a typical off-the-shelf rule.
rules:
  - id: naive-request-identity-into-data-scope
    mode: taint
    languages: [python]
    severity: ERROR
    message: Client-supplied identifier selects which tenant's or user's data is loaded.
    metadata: {owasp-llm: "LLM02:2025 Sensitive Information Disclosure"}
    pattern-sources:
      - pattern: $REQ["tenant_id"]
      - pattern: $REQ["conversation_id"]
    pattern-sinks:
      - patterns:
          - pattern: $IDX.search(..., tenant_id=$SINK, ...)
          - focus-metavariable: $SINK
      - pattern: $MEM.load(...)

  - id: naive-tool-param-controls-recipient
    languages: [python]
    severity: ERROR
    message: A tool argument chosen by the model sets the email recipient.
    metadata: {owasp-llm: "LLM06:2025 Excessive Agency"}
    patterns:
      - pattern-inside: |
          def $TOOL($CTX, ..., $P, ...):
              ...
      - pattern: $MAILER.send(..., to=$P, ...)
