name: ci

on: [push, pull_request]

jobs:
  test-and-score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Behavioral tests (vulnerable / fixed / negative)
        run: pytest -q
      - name: Score Semgrep rule sets against labels
        run: python scripts/score_semgrep.py >> "$GITHUB_STEP_SUMMARY"
