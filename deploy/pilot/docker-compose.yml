# The always-on pilot: one host, one HTTPS address, every recruiter signs in with their own account.
#
#   cp .env.pilot.example .env      (fill it in on the server; never commit it)
#   docker compose up -d --build
#
# Services restart on their own after a reboot or a crash. Nothing here holds a password or a sample account:
# the values come from .env on the server. CVs and other files live in the private "media" volume and are only
# served through the portal's permission checks (never by Caddy).
name: iefcl-portal

x-app: &app
  build:
    context: ../..
  env_file: .env
  environment: &env
    DJANGO_DEBUG: "false"
    POSTGRES_HOST: db
    SECURE_COOKIES: "true"
    PORTAL_UPDATES_PATH: /exports
    PORTAL_INPUT_ROOTS: /inputs
    WORKER_NAME: pilot-worker
  volumes:
    - media:/app/media
    # Shared folders the portal reads (CV folders, workbooks): read-only, the same paths for web and worker.
    - ${PORTAL_INPUTS_HOST_PATH:-./inputs}:/inputs:ro
    # Where "Portal updates.xlsx" is written for the team.
    - ${PORTAL_EXPORTS_HOST_PATH:-./exports}:/exports
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      retries: 10

  web:
    <<: *app
    # gthread workers: the screens' live checks (/intake/live/) are tiny and frequent.
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --threads 8
             --worker-class gthread --timeout 180 --access-logfile -"
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/accounts/login/', timeout=5)"]
      interval: 30s
      retries: 5

  # The background worker: workbook saves and CV folders as they change, the queue (CVs, OCR, re-assessment),
  # Portal updates.xlsx. Only this service reads the live inputs.
  worker:
    <<: *app
    command: python manage.py run_worker
    environment:
      <<: *env
      PORTAL_INPUTS_ENABLED: "true"
    stop_grace_period: 30s

  # Timed jobs that must not be hurried: reminders, department summaries, the recruitment mailbox, retirement alerts,
  # and a nightly backup (checked by restoring it) into the private backups folder.
  scheduler:
    <<: *app
    environment:
      <<: *env
      PORTAL_INPUTS_ENABLED: "false"
    command: >
      sh -c 'i=0; while true; do
        python manage.py send_reminders;
        python manage.py send_department_summaries;
        [ -n "$$CV_INBOX_HOST" ] && python manage.py fetch_cv_emails;
        [ $$((i % 96)) -eq 0 ] && python manage.py send_retirement_alerts;
        [ $$((i % 96)) -eq 8 ] && python manage.py portal_backup --out /backups --verify;
        i=$$((i + 1)); sleep 900; done'
    volumes:
      - media:/app/media
      - ${PORTAL_INPUTS_HOST_PATH:-./inputs}:/inputs:ro
      - ${PORTAL_EXPORTS_HOST_PATH:-./exports}:/exports
      - ${PORTAL_BACKUPS_HOST_PATH:-./backups}:/backups

  caddy:
    image: caddy:2
    ports: ["80:80", "443:443"]
    environment:
      PORTAL_DOMAIN: ${PORTAL_DOMAIN:?set PORTAL_DOMAIN in .env}
      PORTAL_TLS: ${PORTAL_TLS:-internal}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on: [web]

volumes:
  pgdata:
  media:
  caddy_data:
  caddy_config:
